[package]
name = "flaremail-rs"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for Cloudflare Email Service"
license = "MIT"
repository = "https://github.com/lassejlv/flaremail"
homepage = "https://github.com/lassejlv/flaremail#readme"
readme = "README.md"
keywords = ["cloudflare", "email", "mail", "sdk"]
categories = ["api-bindings", "email"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
